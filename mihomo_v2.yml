dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    # 登录、实时音视频与系统连通性域名不走 fake-ip。
    - oauth2.googleapis.com
    - accounts.google.com
    - +.googleapis.com
    - +.challenges.cloudflare.com
    - +.livekit.cloud
    # 局域网和保留域名需要保留真实解析结果。
    - +.lan
    - +.local
    - +.localdomain
    - +.localhost
    - +.home.arpa
    - +.example
    - +.invalid
    - +.test
    # NTP 与 STUN 依赖真实地址。
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - ntp.*.com
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - +.pool.ntp.org
    - time1.cloud.tencent.com
    - stun.*.*
    - stun.*.*.*
    # Apple 更新、推送和 Private Relay。
    - swscan.apple.com
    - mesu.apple.com
    - +.push.apple.com
    - apple-relay.apple.com
    - apple-relay.mask.apple-dns.net
    - gateway.fe2.apple-dns.net
    - gateway.icloud.com
    # 操作系统联网检测。
    - +.msftconnecttest.com
    - +.msftncsi.com
    # 主机游戏平台的 NAT 探测与联机服务。
    - '*.*.*.srv.nintendo.net'
    - '*.*.stun.playstation.net'
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - +.ipv6.microsoft.com
    - teredo.*.*
    - teredo.*.*.*
  ipv6: false
  default-nameserver: &cn_dns
    - 119.29.29.29
    - 223.5.5.5
  proxy-server-nameserver: *cn_dns
  direct-nameserver: *cn_dns
  nameserver: *cn_dns
  fallback: &oversea_dns
    - https://1.1.1.1/dns-query#节点选择
    - https://8.8.8.8/dns-query#节点选择
  nameserver-policy:
    geosite:private: *cn_dns
    geosite:cn: *cn_dns
    geosite:geolocation-!cn: *oversea_dns
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

